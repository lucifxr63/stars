name: deploy-functions

# Despliega automáticamente las Supabase Edge Functions al mergear a main.
# Resuelve el problema "mergeado ≠ desplegado": antes había que correr
# `supabase functions deploy` a mano y era fácil olvidarlo → prod con código viejo.
#
# REQUISITO (acción del equipo, una sola vez):
#   GitHub → Settings → Secrets and variables → Actions → New repository secret:
#     SUPABASE_ACCESS_TOKEN = <token de https://supabase.com/dashboard/account/tokens>
#   El project-ref de prod ya está abajo (fcdhcntyvsydnvjwopfe).
#
# Sin el secret, el job falla de forma VISIBLE (no toca prod) — señal de "configurame".

on:
  push:
    branches: [main]
    paths:
      - 'validateai/supabase/functions/**'

permissions:
  contents: read

env:
  PROJECT_REF: fcdhcntyvsydnvjwopfe

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # para diffear HEAD^..HEAD

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Determinar qué desplegar
        id: plan
        run: |
          changed=$(git diff --name-only HEAD^ HEAD -- validateai/supabase/functions || true)
          echo "Cambios:"; echo "$changed"
          # Funciones cambiadas directamente (dir de primer nivel bajo functions/).
          cands=$(echo "$changed" \
            | sed -nE 's#^validateai/supabase/functions/([^/]+)/.*#\1#p' | sort -u)
          # Si cambió _shared, agregar SOLO las funciones que lo importan (no todas).
          if echo "$changed" | grep -q 'functions/_shared/'; then
            echo "Cambió _shared → agregando funciones que lo importan."
            importers=$(grep -rl '\.\./_shared/' validateai/supabase/functions/*/index.ts 2>/dev/null \
              | sed -E 's#.*/functions/([^/]+)/.*#\1#')
            cands=$(printf '%s\n%s\n' "$cands" "$importers" | sort -u)
          fi
          # Filtrar: solo dirs con index.ts (excluye _shared, shared-schemas y otros
          # módulos sin entrypoint que no son funciones desplegables).
          funcs=""
          for f in $cands; do
            [ -n "$f" ] && [ -f "validateai/supabase/functions/$f/index.ts" ] && funcs="$funcs $f"
          done
          funcs=$(echo "$funcs" | sed 's/^ *//;s/ *$//')
          echo "funcs=$funcs" >> "$GITHUB_OUTPUT"
          echo "A desplegar: $funcs"

      - name: Deploy
        if: steps.plan.outputs.funcs != ''
        working-directory: validateai
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for fn in ${{ steps.plan.outputs.funcs }}; do
            echo "── Deploying $fn ──"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
          done

      # Avisa a la sala de control QUE cambió y CUANDO. Sin esto no hay forma de
      # responder "se rompió solo o lo rompimos?" cuando algo empieza a fallar:
      # el canal de incidentes muestra el sintoma y este muestra la causa
      # candidata a la misma hora.
      #
      # `always()` a proposito: un deploy FALLIDO es justamente lo que hay que
      # saber. Sin el, el paso se saltea y el silencio se lee como exito.
      - name: Notificar a Discord
        if: always() && steps.plan.outputs.funcs != ''
        env:
          HOOK: ${{ secrets.DISCORD_DEPLOYS_WEBHOOK }}
        run: |
          # `if` y no `[ -z ] && { ... }`: con HOOK seteado ese test devuelve 1,
          # la linea entera devuelve 1 y bash -e (el shell por defecto de
          # Actions) mata el paso justo cuando SI habia que avisar.
          if [ -z "${HOOK:-}" ]; then
            echo "Sin DISCORD_DEPLOYS_WEBHOOK — se omite el aviso"
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            COLOR=5234826; EMOJI="🟢"; ESTADO="desplegado"
          else
            COLOR=14700383; EMOJI="🔴"; ESTADO="FALLÓ"
          fi

          # jq -Rs escapa el mensaje de commit: los titulos traen comillas,
          # backticks y saltos de linea que romperian el JSON a mano.
          MSG=$(git log -1 --pretty=%s | jq -Rs '.')
          SHA=$(git rev-parse --short HEAD)
          FUNCS="${{ steps.plan.outputs.funcs }}"

          jq -n --argjson msg "$MSG" \
                --arg emoji "$EMOJI" --arg estado "$ESTADO" --arg sha "$SHA" \
                --arg funcs "$FUNCS" --arg actor "${{ github.actor }}" \
                --argjson color "$COLOR" \
                '{embeds:[{
                   title: ($emoji + "  Edge Functions " + $estado),
                   description: $msg,
                   color: $color,
                   fields: [
                     {name:"Funciones", value:$funcs, inline:true},
                     {name:"Commit",    value:$sha,   inline:true},
                     {name:"Autor",     value:$actor, inline:true}
                   ],
                   footer:{text:"deploy-functions · Deploys"}
                 }]}' \
            | curl -sS -X POST -H 'content-type: application/json' -d @- "$HOOK" >/dev/null
