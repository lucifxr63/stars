paths:
  /api/v1/rag/query:
    post:
      tags: [RAG]
      summary: Consulta semÃ¡ntica a la base de conocimiento
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Texto libre para buscar contexto relevante.
                  example: "estrategias de go-to-market para fintech en Chile"
                filters:
                  type: object
                  description: Filtros opcionales (ej. industria, tipo de documento).
      responses:
        '200':
          description: Fragmentos de conocimiento relevantes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer:
                    type: string
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        id:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/data/economy:
    get:
      tags: [Datos EconÃ³micos]
      summary: Retorna indicadores econÃ³micos en cachÃ©
      description: UF, IPC y DÃ³lar cacheados desde CMF y SII.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Indicadores vigentes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uf:
                    type: number
                    example: 38521.45
                  uf_date:
                    type: string
                    example: "2026-05-21"
                  ipc_anual:
                    type: number
                    example: 4.2
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/webhooks:
    post:
      tags: [Webhooks]
      summary: Registra un webhook de notificaciÃ³n
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, event]
              properties:
                url:
                  type: string
                  format: uri
                  example: "https://tu-sistema.cl/webhook/validateai"
                event:
                  type: string
                  enum: [pjud.resolved, fintoc.connected, validation.complete]
      responses:
        '201':
          description: Webhook registrado.
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Webhooks]
      summary: Lista webhooks registrados
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Lista de webhooks activos.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/rag/ingest/text:
    post:
      tags: [IngestiÃ³n]
      summary: Ingesta texto plano a la base vectorial
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, metadata]
              properties:
                text:
                  type: string
                metadata:
                  type: object
      responses:
        '201':
          description: Documento ingestado y vectorizado.
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "API Key generada en el portal de desarrolladores. Formato: `val_live_XXXXXXXXXXXX`"

  responses:
    BadRequest:
      description: ParÃ¡metros invÃ¡lidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: API Key faltante, invÃ¡lida o revocada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
        code:
          type: string
