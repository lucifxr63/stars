    description: ProducciÃ³n

tags:
  - name: RAG
    description: Motor de bÃºsqueda semÃ¡ntica y base de conocimiento
  - name: Datos EconÃ³micos
    description: Indicadores financieros en tiempo real (CMF, SII)
