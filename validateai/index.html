        <h1>El dossier que un VC haría sobre tu startup, antes de construirla</h1>
        <p>Validus es una plataforma de IA que valida ideas de startup. En 4 pasos arma un dossier nivel-VC con score de viabilidad, análisis de mercado (TAM/SAM/SOM), unit economics, gobernanza y due diligence — en unos 10 minutos. Hecho en Chile, pensado para founders de LatAm.</p>

        <h2>Cómo funciona (4 pasos)</h2>
        <ol>
          <li><strong>Tu idea:</strong> describe el problema y la solución en lenguaje natural.</li>
          <li><strong>Tu mercado:</strong> segmento (ICP), tamaño y primeros 100 clientes.</li>
          <li><strong>Tu equipo:</strong> experiencia y founder-market fit.</li>
          <li><strong>Tu dossier:</strong> score, las 7 secciones y un PDF investor-ready.</li>
        </ol>

        <h2>El dossier (7 secciones)</h2>
        <p>Veredicto, Validación, Estrategia, Finanzas, Hoja de Ruta, Inversión y Due Diligence. Potenciado por Bralidus, el motor GraphRAG con datos institucionales reales de Chile (Banco Central, CMF, SEIA, INAPI) y procedencia citable.</p>

        <h2>Precios (CLP/mes)</h2>
        <ul>
          <li><strong>Free — $0:</strong> 3 validaciones/mes, score básico.</li>
          <li><strong>Basic — $9.990 CLP:</strong> 15 validaciones/mes, score detallado 5D y análisis de mercado.</li>
          <li><strong>Pro — $20.000 CLP:</strong> 50 validaciones/mes, unit economics, gobernanza y fundraising.</li>
          <li><strong>Premium — $50.000 CLP:</strong> due diligence (SII+INAPI+CMF), data room PDF y acceso a API.</li>
        </ul>

        <h2>Preguntas frecuentes</h2>
        <h3>¿Qué es Validus?</h3>
        <p>Una plataforma de IA que valida ideas de startup y entrega un dossier nivel-VC con score, mercado, unit economics, gobernanza y due diligence.</p>
        <h3>¿Cuánto cuesta?</h3>
        <p>Hay un plan gratis con 3 validaciones al mes; los pagados van de US$19 (Basic) a US$149 (Premium).</p>
        <h3>¿Para quién es?</h3>
        <p>Para founders y PYMEs de Chile y LatAm, y para inversores o aceleradoras que evalúan startups.</p>
        <h3>¿Mis datos están seguros?</h3>
        <p>Sí. Validus cumple la Ley 21.719 de protección de datos personales de Chile; los datos se cifran y anonimizan.</p>
